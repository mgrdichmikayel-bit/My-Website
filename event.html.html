<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تفاصيل الفعالية</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand fw-bold text-white">
دليل الفعاليات
</a>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">الرئيسية</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">الفعاليات</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">عن الدليل</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">اتصل بنا</a>
                </li>
            </ul>

        </div>
    </nav>


    <div class="container mt-5">

        <h2 id="eventTitle"></h2>

        <img id="eventImage" class="img-fluid rounded shadow" style="max-height:500px;width:100%;object-fit:cover;">

        <p class="mt-4 fs-5" id="eventDesc"></p>

        <p>
            <strong>التاريخ:</strong>
            <span id="eventDate"></span>
        </p>

        <p>
            <strong>المكان:</strong>
            <span id="eventPlace"></span>
        </p>

        <button class="btn btn-success">
أضف للتقويم
</button>

        <button class="btn btn-primary">
مشاركة
</button>

    </div>



    <footer class="footer mt-5">
        <p>
            © 2026 دليل الفعاليات - جميع الحقوق محفوظة
        </p>
    </footer>


    <script>
        const eventsData = {

            1: {
                title: "حفلة موسيقية",
                image: "images/10614246f1bcf71fbe62d74bfe9c685e.jpg",
                desc: "حفلة موسيقية رائعة تضم أشهر الفنانين.",
                date: "15 سبتمبر 2026",
                place: "دار الأوبرا دمشق"
            },

            2: {
                title: "فعالية جري رياضية",
                image: "images/c6b2e3a74394149cf347ab7c251890de.jpg",
                desc: "قبل بزوغ الفجر، بدأت الحشود تتوافد نحو خط البداية. الهواء المنعش يمتزج بحماس العدائين الذين يرتدون قمصانهم الملونة وأرقامهم التعريفية. المشهد كان لوحة من الحركة والنشاط؛ آلاف الخطوات المتسارعة، وأنفاس منتظمة، وهتافات المشجعين التي تملأ جنبات الطريق لتشجيع المحترفين والهواة على حد سواء.",
                date: "20 مايو 2026",
                place: "حلب ملعب الجلاء"
            },

            3: {
                title: "مهرجان ثقافي",
                image: "images/image22.jpg",
                desc: "حولت ساحة المدينة الكبرى إلى لوحة فنية نابضة بالحياة، حيث اختلطت روائح البخور والقهوة العربية التقليدية بأنغام الموسيقى الفلكلورية. الأكشاك الخشبية المزينة بالأعلام والزخارف التراثية اصطفت لتستقبل الزوار بابتسامة، في أجواء عائلية غلب عليها الفضول وحب الاستكشاف.",
                date: "1 يونيو 2026",
                place: "حمص معهد الغسانية"
            },

            4: {
                title: "مباراة كرة القدم",
                image: "images/530360359_1187095550114592_1897296934935855138_n.jpg",
                desc: "حت أضواء الكاشفة وفي ليلة صافية، احتضن الملعب مواجهة ودية اتسمت بالروح الرياضية العالية بعيداً عن ضغوط النقاط وحسابات التأهل. الحضور الجماهيري كان لافتاً، حيث امتلأت المدرجات بالعائلات والشباب الذين جاؤوا للاستمتاع بكرة قدم نقية وجميلة.",
                date: "10 أكتوبر 2026",
                place: "ملعب العباسيين دمشق"
            },
            5: {
                title: "مسابقة برمجية",
                image: "images/Untitled-E-games.jpg",
                desc: "مسابقة على مستوى القطر لأختبار قدرات المبرمجين",
                date: "10 يونيو 2026",
                place: "دمشق الهمك"
            },
            6: {
                title: "رحلة سياحية",
                image: "mages/tourist.jpg",
                desc: "رحلة سياحية استكشافية مليئة بالمغامرات، تنقلك بين طبيعة خلابة وتضاريس متنوعة، من الجبال والوديان إلى الغابات والشواطئ. تعيش فيها تجارب حماسية مثل المشي لمسافات طويلة، التسلق، واكتشاف أماكن مخفية، مع لحظات هدوء تأخذك بعيدًا عن الروتين وتقرّبك من جمال العالم. ",
                date: "10 اغسطس 2026",
                place: "لبنان alley"
            }

        };


        const params =
            new URLSearchParams(window.location.search);

        const id = params.get("id");


        if (eventsData[id]) {

            document.getElementById("eventTitle").innerText =
                eventsData[id].title;

            document.getElementById("eventImage").src =
                eventsData[id].image;

            document.getElementById("eventDesc").innerText =
                eventsData[id].desc;

            document.getElementById("eventDate").innerText =
                eventsData[id].date;

            document.getElementById("eventPlace").innerText =
                eventsData[id].place;

        } else {

            document.getElementById("eventTitle").innerText =
                "الفعالية غير موجودة";

        }
    </script>

</body>

</html>
